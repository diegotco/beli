name: Beli Health Check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health endpoint
        id: check
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://web-production-f3c9e.up.railway.app/health || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert via Telegram if down
        if: steps.check.outputs.failed == 'true'
        run: |
          MSG="🚨 *Beli está caído* 🚨%0A%0AEl endpoint de salud devolvió HTTP ${{ steps.check.outputs.status }} en lugar de 200.%0A%0ARailway debería reiniciarlo automáticamente — te avisaré cuando vuelva a estar en línea."
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown"

      - name: Check if previous run was a failure
        id: prev
        if: steps.check.outputs.failed != 'true'
        run: |
          PREV=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/health-check.yml/runs?per_page=5&status=completed" \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
runs = data.get('workflow_runs', [])
# Skip the current run (first in list), look at the ones before it
for r in runs[1:]:
    if r['conclusion'] in ('failure', 'success'):
        print(r['conclusion'])
        break
else:
    print('success')
")
          echo "prev_conclusion=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous run conclusion: $PREV"

      - name: Notify back online
        if: steps.check.outputs.failed != 'true' && steps.prev.outputs.prev_conclusion == 'failure'
        run: |
          MSG="✅ Beli está en línea de nuevo."
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}"

      - name: Log healthy
        if: steps.check.outputs.failed != 'true'
        run: echo "✅ Beli is healthy (HTTP 200)"
