name: Beli Health Check

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check Beli and WAHA
        run: |
          BELI=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://web-production-f3c9e.up.railway.app/health 2>/dev/null || echo "000")

          WAHA=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://waha-production-7aac.up.railway.app/api/health 2>/dev/null || echo "000")

          echo "Beli: $BELI | WAHA: $WAHA"

          if [ "$BELI" != "200" ]; then
            curl -s -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚨 Beli está caído (HTTP $BELI). Railway debería reiniciarlo automáticamente." \
              || true
          fi

          if [ "$WAHA" != "200" ]; then
            curl -s -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=⚠️ WAHA (WhatsApp) está caído (HTTP $WAHA). Los mensajes de WhatsApp no se entregarán hasta que se recupere." \
              || true
          fi

          echo "✅ Done (Beli=$BELI, WAHA=$WAHA)"
