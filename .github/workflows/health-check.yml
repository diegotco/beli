name: Beli Health Check

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # WAHA is NOT checked here on purpose: Beli's internal health monitor
      # polls it every 5 minutes with deduplication (one alert per outage).
      # This Action only covers the case Beli cannot self-report: Beli itself
      # being down.
      - name: Check Beli
        run: |
          BELI=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://web-production-f3c9e.up.railway.app/health 2>/dev/null || echo "000")

          echo "Beli: $BELI"

          if [ "$BELI" != "200" ]; then
            curl -s -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚨 Beli está caído (HTTP $BELI). Railway debería reiniciarlo automáticamente." \
              || true
          fi

          echo "✅ Done (Beli=$BELI)"
